<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints - RWA Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top-bar">
    <div class="left-nav">
        <h2>DoorStep Amenities</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="staff.html">Staff</a>
            <a href="complaints.html" class="active">Complaints</a>
            <a href="payments.html">Payments</a>
        </nav>
    </div>
    <div class="right-icons">
        <div class="icon-btn">📍 New Delhi</div>
        <div class="icon-btn">🔍</div>
        <div class="icon-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="11" stroke="black" stroke-width="2" />
                <circle cx="12" cy="7" r="4" stroke="black" stroke-width="2" />
                <path d="M4 21c1-5 7-6 8-6s7 1 8 6" stroke="black" stroke-width="2" />
            </svg>
        </div>
    </div>
</header>

<section class="hero">
    <h2>Register a Complaint</h2>
    <p>Submit issues like plumbing, electrical, housekeeping and more. The system will automatically assign the right staff member.</p>
</section>

<section class="content-section">
    <div class="card">
        <h3>Complaint Form</h3>
        <form>
            <label>Building Block</label>
            <input type="text" placeholder="e.g., A Block">

            <label>Floor Number</label>
            <input type="number" placeholder="e.g., 3">

            <label>Flat Number</label>
            <input type="text" placeholder="e.g., 301">

            <label>Complaint Type</label>
            <select>
                <option>Plumbing</option>
                <option>Electrical</option>
                <option>Housekeeping</option>
                <option>Security</option>
                <option>Network</option>
                <option>Installation</option>
                <option>DTH</option>
                <option>Other</option>
            </select>

            <label>Description</label>
            <textarea placeholder="Describe the issue..." rows="4"></textarea>

            <label>Preferred Visit Time</label>
            <input type="time">

            <label>Urgency</label>
            <select>
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
            </select>

            <button class="btn" type="submit">Submit Complaint</button>
        </form>
    </div>
</section>

<footer>
    <p>© 2025 RWA Society Portal. All Rights Reserved.</p>
</footer>
</body>
</html>
